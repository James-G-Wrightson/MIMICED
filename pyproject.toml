# Python environment for 2_chiefcomp.ipynb and 2b_chiefcomp_validity.ipynb (Python 3.12).
# Managed with uv: `uv sync` builds .venv from uv.lock; requirements.txt is exported
# from the lock file for pip users.
#
# Three of these pins are load-bearing and must not be relaxed:
#   numpy 1.26.4      scikit-learn 1.3.0 imports numpy.core.numeric.ComplexWarning,
#                     which numpy 2.0 removed. pip will happily install numpy 2.x
#                     alongside scikit-learn 1.3.0, and the notebook then fails on
#                     its first import.
#   scipy 1.13.1      Left unpinned, pip installs a scipy that itself requires
#                     numpy >= 2, which reintroduces the clash above.
#   transformers      Left unpinned, pip installs >= 4.56, which refuses to load a
#     4.51.3          pytorch_model.bin unless torch >= 2.6 (CVE-2025-32434). The
#                     BioBERT sentence-transformer used here is distributed in that
#                     format, so with torch 2.5.1 the model cannot be loaded at all.

[project]
name = "mimiced"
version = "0.1.0"
description = "Chief-complaint embedding and clustering for the MIMIC-IV-ED non-urgent visit analysis"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib==3.10.5",
    "nltk==3.9.1",
    "numpy==1.26.4",
    "pandas==2.3.1",
    "pyarrow==19.0.0",
    "scikit-learn==1.3.0",
    "scipy==1.13.1",
    "sentence-transformers==4.1.0",
    "torch==2.5.1",
    "transformers==4.51.3",
    "ipykernel",
    "jupyter",
]

[tool.uv]
package = false
